name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: vercel-log-drain
  REGION: europe-west1
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/vercel-log-drain

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: gcr.io
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --service-account ${{ secrets.CLOUD_RUN_SERVICE_ACCOUNT }} \
            --set-env-vars "GCP_PROJECT_ID=${{ env.PROJECT_ID }},LOG_NAME=${{ secrets.LOG_NAME }},VERCEL_WEBHOOK_SECRET=${{ secrets.VERCEL_WEBHOOK_SECRET }}" \
            --memory 256Mi \
            --max-instances 10 \
            --min-instances 0 \
            --allow-unauthenticated \
            --quiet
