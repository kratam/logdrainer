name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: vercel-log-drain
  REGION: europe-west1

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push to Artifact Registry
        run: gcloud builds submit --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }} --timeout=10m

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --service-account ${{ secrets.CLOUD_RUN_SERVICE_ACCOUNT }} \
            --set-env-vars "GCP_PROJECT_ID=${{ env.PROJECT_ID }},LOG_NAME=${{ secrets.LOG_NAME }},VERCEL_WEBHOOK_SECRET=${{ secrets.VERCEL_WEBHOOK_SECRET }}" \
            --memory 256Mi \
            --max-instances 10 \
            --min-instances 0 \
            --allow-unauthenticated \
            --quiet
